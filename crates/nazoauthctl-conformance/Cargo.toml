[package]
name = "nazoauthctl-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.103"
aws-lc-rs = { version = "1.18.0", default-features = false, features = ["aws-lc-sys"] }
nazo-operator-protocol.workspace = true
fs2 = "0.4.3"
libc = "0.2.175"
rustix = { version = "1.1.4", features = ["fs", "process"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
regex = "1.11.1"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
p256 = { version = "0.14.0", features = ["ecdsa", "getrandom"] }
pkcs1 = "0.7.5"
pkcs8 = "0.11.0"
rand = "0.10.1"
rcgen = { version = "0.14.9", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
subtle = "2.6.1"
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
time = { version = "0.3", default-features = false, features = ["std", "parsing", "formatting"] }
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v4", "v7", "serde"] }
url = "2.5.8"
zeroize = { version = "1.8.2", features = ["derive", "serde"] }
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager (DPAPI-backed by the OS) is the only supported
# non-Unix persistence backend. The crate is not enabled on Unix, where the
# owner-only filesystem implementation below is independently verified.
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
