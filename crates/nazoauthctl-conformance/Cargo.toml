[package]
name = "nazoauthctl-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.103"
libc = "0.2.175"
rustix = { version = "0.38.44", features = ["fs", "process"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
regex = "1.11.1"
base64 = "0.22.1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring"] }
rsa = { version = "0.9.10", features = ["pem"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
time = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2.0.18"
uuid = { version = "1.23.5", features = ["v4", "v7"] }
url = "2.5.8"
zeroize = { version = "1.8.2", features = ["derive", "serde"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager (DPAPI-backed by the OS) is the only supported
# non-Unix persistence backend. The crate is not enabled on Unix, where the
# owner-only filesystem implementation below is independently verified.
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
