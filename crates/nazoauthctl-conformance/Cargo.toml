[package]
name = "nazoauthctl-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nazoauthctl-runtime = { path = "../nazoauthctl-runtime" }
anyhow = "1.0.104"
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
nazo-operator-protocol.workspace = true
fs2 = "0.4.3"
libc = "0.2.190"
rustix = { version = "1.1.5", features = ["fs", "process"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
regex = "1.13.1"
base64 = "0.23.1"
chrono = "0.4.45"
ed25519-dalek = "3.0.0"
p256 = { version = "0.14.0", features = ["ecdsa", "getrandom"] }
pkcs1 = "0.7.5"
pkcs8 = "0.11.0"
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
time = { version = "0.3.55", default-features = false, features = ["std", "parsing", "formatting"] }
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v4", "v7", "serde"] }
url = "2.5.8"
zeroize = { version = "1.9.0", features = ["derive", "serde"] }
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager (DPAPI-backed by the OS) is the only supported
# non-Unix persistence backend. The crate is not enabled on Unix, where the
# owner-only filesystem implementation below is independently verified.
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[target.'cfg(windows)'.dev-dependencies]
# Explicit native target and raw legacy bytes for an isolated compatibility fixture.
keyring-core = "1.0.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
