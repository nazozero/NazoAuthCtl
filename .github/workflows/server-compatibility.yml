name: signed-server-compatibility

on:
  workflow_dispatch:
    inputs:
      controller_ref:
        description: Exact controller commit to build and test
        required: true
        type: string
      server_release:
        description: Exact supported NazoAuth release tag
        required: true
        type: string
  workflow_call:
    inputs:
      controller_ref:
        description: Exact controller commit to build and test
        required: true
        type: string
      server_release:
        description: Exact supported NazoAuth release tag
        required: true
        type: string

concurrency:
  # In a reusable workflow github.workflow is the caller's workflow name.
  # A literal group keeps this child from cancelling its own release caller.
  group: signed-server-compatibility-${{ github.ref }}-${{ inputs.controller_ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NAZOAUTHCTL_BUILD_COMMIT: ${{ inputs.controller_ref }}

jobs:
  current-controller:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.controller_ref }}
      - name: Assert exact controller commit
        shell: bash
        env:
          EXPECTED_CONTROLLER_REF: ${{ inputs.controller_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CONTROLLER_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER_REF"
      - name: Build current controller once
        run: cargo build --locked --workspace --all-targets --all-features --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-controller
          path: target/release/nazoauthctl
          if-no-files-found: error

  signed-current-server:
    needs: current-controller
    name: current ctl / server ${{ inputs.server_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
      id-token: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.controller_ref }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: current-controller
          path: controller
      - name: Assert the supported server release
        shell: bash
        env:
          SERVER_RELEASE: ${{ inputs.server_release }}
        run: |
          set -euo pipefail
          test "$SERVER_RELEASE" = v0.2.3
      - name: Resolve one immutable current server identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_RELEASE: ${{ inputs.server_release }}
        run: |
          set -euo pipefail
          test "$SERVER_RELEASE" = v0.2.3
          ref_type="$(gh api "/repos/nazozero/NazoAuth/git/ref/tags/$SERVER_RELEASE" --jq '.object.type')"
          ref_sha="$(gh api "/repos/nazozero/NazoAuth/git/ref/tags/$SERVER_RELEASE" --jq '.object.sha')"
          for _ in 1 2 3 4; do
            case "$ref_type" in
              commit) break ;;
              tag)
                tag_json="$(gh api "/repos/nazozero/NazoAuth/git/tags/$ref_sha")"
                ref_type="$(jq -er '.object.type' <<<"$tag_json")"
                ref_sha="$(jq -er '.object.sha' <<<"$tag_json")"
                ;;
              *) echo "server tag resolves to unsupported git object type: $ref_type" >&2; exit 1 ;;
            esac
          done
          test "$ref_type" = commit
          [[ "$ref_sha" =~ ^[0-9a-f]{40}$ ]]

          lock_line="$(grep -A4 '^name = "nazo-operator-protocol"$' Cargo.lock | grep '^source = ' || true)"
          test -n "$lock_line"
          protocol_rev="$(sed -n 's#.*git+https://github.com/nazozero/NazoAuth\.git?rev=\([0-9a-f]\{40\}\).*#\1#p' <<<"$lock_line")"
          [[ "$protocol_rev" =~ ^[0-9a-f]{40}$ ]]
          test "$protocol_rev" = "$ref_sha"

          {
            echo "SERVER_PEELED_COMMIT=$ref_sha"
            echo "OPERATOR_PROTOCOL_REV=$protocol_rev"
          } >>"$GITHUB_ENV"
      - name: Execute the exact controller artifact through its production protocol path
        shell: bash
        env:
          EXPECTED_CONTROLLER_REF: ${{ inputs.controller_ref }}
        run: |
          set -euo pipefail
          chmod 0755 controller/nazoauthctl
          state_root="$(mktemp -d)"
          trap 'rm -rf "$state_root"' EXIT
          printf '%s' \
            '{"schema":5,"operation_id":"019018c0-0000-7000-8000-000000000001","operation":{"kind":"hello"}}' \
            | NAZOAUTHCTL_TARGET_STATE_ROOT="$state_root" controller/nazoauthctl remote exec \
            >controller-hello.json
          jq -e --arg commit "$EXPECTED_CONTROLLER_REF" '
            .schema == 5
            and .operation_id == "019018c0-0000-7000-8000-000000000001"
            and .outcome.status == "completed"
            and .outcome.body.completion == "hello"
            and .outcome.body.hello.product == "nazoauthctl"
            and .outcome.body.hello.remote_exec_schema == 5
            and .outcome.body.hello.commit == $commit
          ' controller-hello.json
      - name: Download and verify the signed host server
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_RELEASE: ${{ inputs.server_release }}
        run: |
          set -euo pipefail
          gh release download "$SERVER_RELEASE" --repo nazozero/NazoAuth \
            --pattern nazoauth-x86_64-unknown-linux-gnu --dir signed-server
          gh attestation verify signed-server/nazoauth-x86_64-unknown-linux-gnu \
            --repo nazozero/NazoAuth \
            --signer-workflow nazozero/NazoAuth/.github/workflows/release-security.yml \
            --source-ref "refs/tags/$SERVER_RELEASE" \
            --deny-self-hosted-runners
      - name: Verify the protocol-2 host identity
        shell: bash
        env:
          SERVER_RELEASE: ${{ inputs.server_release }}
        run: |
          set -euo pipefail
          server=signed-server/nazoauth-x86_64-unknown-linux-gnu
          chmod 0755 "$server"
          "$server" build-identity >host-identity.json
          jq -e --arg release "$SERVER_RELEASE" --arg revision "$SERVER_PEELED_COMMIT" \
            '.release == $release and .protocol == 2 and .revision == $revision' \
            host-identity.json
      - name: Verify the signed OCI identity at its immutable digest
        shell: bash
        env:
          SERVER_RELEASE: ${{ inputs.server_release }}
        run: |
          set -euo pipefail
          repository=ghcr.io/nazozero/nazoauth
          tagged_image="$repository:$SERVER_RELEASE"
          cosign_output="$(cosign verify "$tagged_image" \
            --certificate-identity "https://github.com/nazozero/NazoAuth/.github/workflows/release-security.yml@refs/tags/${SERVER_RELEASE}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com)"
          index_digest="$(jq -er '
            map(.critical.image["docker-manifest-digest"])
            | unique
            | if length == 1 then .[0] else error("expected one signed OCI index digest") end
          ' <<<"$cosign_output")"
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$repository@$index_digest"
          platform_digest="$(docker manifest inspect "$image" | jq -er '
            .manifests
            | map(select(.platform.os == "linux" and .platform.architecture == "amd64"))
            | if length == 1 then .[0].digest else error("expected one linux/amd64 manifest") end
          ')"
          [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$image"
          docker run --rm --network none "$image" nazoauth build-identity >oci-identity.json
          diff -u host-identity.json oci-identity.json
          jq -e --arg revision "$SERVER_PEELED_COMMIT" '.revision == $revision' oci-identity.json
          {
            echo "SERVER_OCI_INDEX_DIGEST=$index_digest"
            echo "SERVER_OCI_PLATFORM_DIGEST=$platform_digest"
          } >>"$GITHUB_ENV"
      - name: Expose Cosign through the controller production command path
        shell: bash
        run: sudo install -m 0755 "$(command -v cosign)" /usr/local/bin/cosign
      - name: Execute VerifiedRelease current production verification
        shell: bash
        env:
          NAZOAUTHCTL_COMPAT_VERIFY_RELEASE: '1'
          EXPECTED_SERVER_RELEASE: ${{ inputs.server_release }}
        run: |
          set -euo pipefail
          export EXPECTED_SERVER_PEELED_COMMIT="$SERVER_PEELED_COMMIT"
          export EXPECTED_OPERATOR_PROTOCOL_REV="$OPERATOR_PROTOCOL_REV"
          export EXPECTED_OCI_INDEX_DIGEST="$SERVER_OCI_INDEX_DIGEST"
          export EXPECTED_OCI_PLATFORM_DIGEST="$SERVER_OCI_PLATFORM_DIGEST"
          # This selected test calls VerifiedRelease::verify directly; the
          # identity assertions below bind that verified manifest to the
          # independently attested host and Cosign-verified OCI artifacts.
          cargo test --locked -p nazoauthctl-core \
            tests::compatibility_executes_verified_release_for_the_current_server \
            -- --ignored --exact
