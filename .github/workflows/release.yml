name: controller-release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  policy:
    outputs:
      self_update_matrix: ${{ steps.resolve_self_update.outputs.matrix }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful controller CI for exact tag commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${RELEASE_SHA}&per_page=100")"
          successful_run="$(printf '%s' "$response" | jq -r --arg sha "$RELEASE_SHA" '
            [
              .workflow_runs[]
              | select(.head_sha == $sha and .head_branch == "main" and .event == "push")
              | select(.status == "completed" and .conclusion == "success")
              | .id
            ] | .[0] // empty
          ')"
          if [ -z "$successful_run" ]; then
            echo "no completed successful controller-ci run exists for tag commit $RELEASE_SHA" >&2
            exit 1
          fi
          echo "controller-ci run $successful_run completed successfully for $RELEASE_SHA"
      - name: Validate immutable controller release input
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          expected = f"v{manifest['package']['version']}"
          actual = os.environ["RELEASE_TAG"]
          if os.environ["RELEASE_REF_TYPE"] == "tag" and actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match Cargo package version {expected!r}")
          print(f"validated controller release input {expected}; publish={os.environ['RELEASE_REF_TYPE'] == 'tag'}")
          PY
      - name: Resolve the previous controller release for self-update validation
        if: github.ref_type == 'tag'
        id: resolve_self_update
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RELEASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          releases="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName,publishedAt)"
          previous_release="$(printf '%s' "$releases" | jq -r --arg current "$CURRENT_RELEASE" '
            map(select(.tagName != $current))
            | sort_by(.publishedAt)
            | reverse
            | .[0].tagName // empty
          ')"
          if [ -z "$previous_release" ]; then
            echo "no previous stable controller release is available for self-update validation" >&2
            exit 1
          fi
          case "$previous_release" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "previous release is not an immutable semantic tag: $previous_release" >&2; exit 1 ;;
          esac
          matrix="$(jq -cn --arg from "$previous_release" --arg to "$CURRENT_RELEASE" \
            '{include:[{from_release:$from,to_release:$to}]}')"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "self-update transition: $previous_release -> $CURRENT_RELEASE"

  build:
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, extension: '' }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, extension: '' }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, extension: .exe }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, extension: .exe }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, extension: '' }
          - { runner: macos-15, target: aarch64-apple-darwin, extension: '' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked --all-targets --all-features --target ${{ matrix.target }}
      - run: cargo build --locked --release --bin nazoauthctl --target ${{ matrix.target }}
      - name: Stage controller binary
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/nazoauthctl${{ matrix.extension }}" \
            "release/nazoauthctl-${{ matrix.target }}${{ matrix.extension }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-${{ matrix.target }}
          path: release/nazoauthctl-${{ matrix.target }}${{ matrix.extension }}
          if-no-files-found: error

  attest:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: controller-*
          path: release
          merge-multiple: true
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/nazoauthctl-*
      - name: Publish immutable controller assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/nazoauthctl-* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  self-update-rollback:
    if: github.ref_type == 'tag'
    needs: [policy, attest]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.self_update_matrix) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_RELEASE: ${{ matrix.to_release }}
      PREVIOUS_RELEASE: ${{ matrix.from_release }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Cosign in the controller's sanitized execution path
        shell: bash
        run: |
          set -euo pipefail
          source="$(command -v cosign)"
          if [ "$source" != /usr/local/bin/cosign ]; then
            sudo install -m 0755 "$source" /usr/local/bin/cosign
          fi
          /usr/local/bin/cosign version >/dev/null
      - name: Download and verify both independent controller Releases
        run: |
          set -euo pipefail
          mkdir -p previous candidate
          gh release download "$PREVIOUS_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern nazoauthctl-x86_64-unknown-linux-gnu --dir previous
          gh release download "$CURRENT_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern nazoauthctl-x86_64-unknown-linux-gnu --dir candidate
          for version in "$PREVIOUS_RELEASE" "$CURRENT_RELEASE"; do
            directory=previous
            [ "$version" = "$PREVIOUS_RELEASE" ] || directory=candidate
            gh attestation verify "$directory/nazoauthctl-x86_64-unknown-linux-gnu" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$version" \
              --deny-self-hosted-runners
          done
      - name: Update, reject a tampered audit chain, and roll back
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d /tmp/controller-self-lifecycle.XXXXXX)"
          trap 'sudo rm -rf "$root"' EXIT
          chmod 0755 "$root"
          binary="$root/bin/nazoauthctl"
          config_root="$root/config"
          state_root="$root/state"
          break_glass_root="$root/break-glass"
          mkdir -p "$root/bin" "$config_root" "$state_root" "$break_glass_root"
          install -m 0755 previous/nazoauthctl-x86_64-unknown-linux-gnu "$binary"
          previous_sha="$(sha256sum "$binary" | cut -d' ' -f1)"
          candidate_sha="$(sha256sum candidate/nazoauthctl-x86_64-unknown-linux-gnu | cut -d' ' -f1)"
          # Self-management runs as root. Keep the fixture directly below the
          # root-owned sticky /tmp boundary, then transfer it only after the
          # runner has finished authoring every initial fixture path.
          sudo chown -R 0:0 "$root"
          sudo chmod 0700 "$break_glass_root"
          sudo env \
            "NAZOAUTHCTL_CONFIG_ROOT=$config_root" \
            "NAZOAUTHCTL_STATE_ROOT=$state_root" \
            "NAZOAUTHCTL_BREAK_GLASS_ROOT=$break_glass_root" \
            "$binary" self check --to "$CURRENT_RELEASE"
          sudo env \
            "NAZOAUTHCTL_CONFIG_ROOT=$config_root" \
            "NAZOAUTHCTL_STATE_ROOT=$state_root" \
            "NAZOAUTHCTL_BREAK_GLASS_ROOT=$break_glass_root" \
            "$binary" self update --to "$CURRENT_RELEASE" --yes
          test "$(sha256sum "$binary" | cut -d' ' -f1)" = "$candidate_sha"

          record="$(sudo find "$state_root/controller-self/audit/records" -type f -name '*.json' | sort | head -n 1)"
          test -n "$record"
          sudo cp "$record" "$root/audit-record.good"
          sudo chown "$(id -u):$(id -g)" "$root/audit-record.good"
          printf 'tampered' | sudo tee -a "$record" >/dev/null
          if sudo env \
            "NAZOAUTHCTL_CONFIG_ROOT=$config_root" \
            "NAZOAUTHCTL_STATE_ROOT=$state_root" \
            "NAZOAUTHCTL_BREAK_GLASS_ROOT=$break_glass_root" \
            "$binary" self rollback --yes; then
            echo 'controller rollback accepted a tampered audit chain' >&2
            exit 1
          fi
          test "$(sha256sum "$binary" | cut -d' ' -f1)" = "$candidate_sha"
          sudo cp "$root/audit-record.good" "$record"
          sudo env \
            "NAZOAUTHCTL_CONFIG_ROOT=$config_root" \
            "NAZOAUTHCTL_STATE_ROOT=$state_root" \
            "NAZOAUTHCTL_BREAK_GLASS_ROOT=$break_glass_root" \
            "$binary" self rollback --yes
          test "$(sha256sum "$binary" | cut -d' ' -f1)" = "$previous_sha"
          sudo env \
            "NAZOAUTHCTL_CONFIG_ROOT=$config_root" \
            "NAZOAUTHCTL_STATE_ROOT=$state_root" \
            "NAZOAUTHCTL_BREAK_GLASS_ROOT=$break_glass_root" \
            "$binary" self check --to "$PREVIOUS_RELEASE"
