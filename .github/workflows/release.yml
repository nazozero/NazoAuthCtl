name: controller-release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Publishing an immutable tag may be retried after any individual upload
# failed.  Never cancel a live publisher: a second job could otherwise race
# the release asset set it is meant to validate.
concurrency:
  group: controller-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful controller CI for exact tag commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${RELEASE_SHA}&per_page=100")"
          successful_run="$(printf '%s' "$response" | jq -r --arg sha "$RELEASE_SHA" '
            [
              .workflow_runs[]
              | select(.head_sha == $sha and .head_branch == "main" and .event == "push")
              | select(.status == "completed" and .conclusion == "success")
              | .id
            ] | .[0] // empty
          ')"
          if [ -z "$successful_run" ]; then
            echo "no completed successful controller-ci run exists for tag commit $RELEASE_SHA" >&2
            exit 1
          fi
          echo "controller-ci run $successful_run completed successfully for $RELEASE_SHA"
      - name: Validate immutable controller release input
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          metadata = json.loads(
              subprocess.run(
                  ["cargo", "metadata", "--locked", "--format-version", "1", "--no-deps"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
          )
          workspace_members = set(metadata["workspace_members"])
          packages = [
              package
              for package in metadata["packages"]
              if package["id"] in workspace_members
          ]
          if not packages:
              raise SystemExit("cargo metadata returned no workspace packages")
          versions = {package["name"]: package["version"] for package in packages}
          workspace_versions = set(versions.values())
          if len(workspace_versions) != 1:
              details = ", ".join(f"{name}={version}" for name, version in sorted(versions.items()))
              raise SystemExit(f"workspace package versions diverge: {details}")
          package_version = next(iter(workspace_versions))
          expected = f"v{package_version}"
          actual = os.environ["RELEASE_TAG"]
          if os.environ["RELEASE_REF_TYPE"] == "tag" and actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match Cargo package version {expected!r}")
          print(
              f"validated {len(packages)} workspace package versions at {expected}; "
              f"publish={os.environ['RELEASE_REF_TYPE'] == 'tag'}"
          )
          PY
  server-compatibility:
    needs: policy
    uses: ./.github/workflows/server-compatibility.yml
    with:
      controller_ref: ${{ github.sha }}
      server_release: v0.2.12
    permissions:
      actions: read
      contents: read
      attestations: read
      packages: read

  build:
    needs: [policy, server-compatibility]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, extension: '' }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, extension: '' }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, extension: .exe }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, extension: .exe }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, extension: '' }
          - { runner: macos-15, target: aarch64-apple-darwin, extension: '' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test and build Linux asset on the Debian 12 compatibility baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073 \
            bash -euo pipefail -c '
              umask 0022
              cargo test --locked --workspace --all-targets --all-features --target "${{ matrix.target }}"
              cargo build --locked --workspace --all-targets --all-features --release --target "${{ matrix.target }}"
              "target/${{ matrix.target }}/release/nazoauthctl" --help >/dev/null
            '
      - name: Test non-Linux asset
        if: runner.os != 'Linux'
        run: cargo test --locked --workspace --all-targets --all-features --target ${{ matrix.target }}
      - name: Build non-Linux asset
        if: runner.os != 'Linux'
        run: cargo build --locked --workspace --all-targets --all-features --release --target ${{ matrix.target }}
      - name: Stage controller binary
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/nazoauthctl${{ matrix.extension }}" \
            "release/nazoauthctl-${{ matrix.target }}${{ matrix.extension }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-${{ matrix.target }}
          path: release/nazoauthctl-${{ matrix.target }}${{ matrix.extension }}
          if-no-files-found: error

  attest:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: controller-*
          path: release
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/nazoauthctl-*
      - name: Publish the exact immutable controller asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            nazoauthctl-x86_64-unknown-linux-gnu
            nazoauthctl-aarch64-unknown-linux-gnu
            nazoauthctl-x86_64-pc-windows-msvc.exe
            nazoauthctl-aarch64-pc-windows-msvc.exe
            nazoauthctl-x86_64-apple-darwin
            nazoauthctl-aarch64-apple-darwin
          )
          for asset in "${expected[@]}"; do
            test -f "release/$asset"
          done
          actual_file=''
          expected_file=''
          download_dir=''
          trap 'rm -f "$actual_file" "$expected_file"; test -z "$download_dir" || rm -rf "$download_dir"' EXIT

          # A retry must resume the same immutable release, never create a
          # second mutable publication attempt.  The release may legitimately
          # be incomplete after a previous upload failure, but it may never
          # contain an asset outside this closed current-only set.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes
          fi

          actual_file="$(mktemp)"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | LC_ALL=C sort -u >"$actual_file"
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            if ! printf '%s\n' "${expected[@]}" | grep -Fqx -- "$asset"; then
              echo "release $RELEASE_TAG contains an unexpected asset: $asset" >&2
              exit 1
            fi
          done <"$actual_file"

          download_dir="$(mktemp -d)"
          for asset in "${expected[@]}"; do
            if grep -Fqx -- "$asset" "$actual_file"; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" --dir "$download_dir"
              if ! cmp --silent "release/$asset" "$download_dir/$asset"; then
                echo "existing release asset differs from this immutable build: $asset" >&2
                exit 1
              fi
              continue
            fi

            # Never overwrite an existing asset. If another resume won the race, fetch and
            # compare its exact bytes; any mismatch remains a hard failure.
            if ! gh release upload "$RELEASE_TAG" "release/$asset#$asset" --repo "$GITHUB_REPOSITORY"; then
              rm -f "$download_dir/$asset"
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" --dir "$download_dir"
              if ! cmp --silent "release/$asset" "$download_dir/$asset"; then
                echo "concurrent release asset differs from this immutable build: $asset" >&2
                exit 1
              fi
            fi
          done

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | LC_ALL=C sort -u >"$actual_file"
          expected_file="$(mktemp)"
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort -u >"$expected_file"
          if ! cmp --silent "$expected_file" "$actual_file"; then
            echo "release $RELEASE_TAG asset set is not exactly the current controller set" >&2
            diff -u "$expected_file" "$actual_file" >&2 || true
            exit 1
          fi
