name: controller-ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controller:
    name: workspace / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, extension: '' }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, extension: .exe }
          - { os: macos-15, target: aarch64-apple-darwin, extension: '' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, extension: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: controller-workspace
      - name: Verify Linux installer syntax
        if: runner.os == 'Linux'
        run: sh -n scripts/install_nazoauthctl.sh
      - name: Test CI artifact trust boundaries
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p test_ci_artifacts.py
      - name: Reject ambiguous controller installation inputs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          touch "$work/existing"
          ln -s "$work/existing" "$work/controller"
          if sudo sh scripts/install_nazoauthctl.sh \
            --version v0.2.0.invalid --install-path "$work/plain"; then
            echo "installer accepted a non-release version" >&2
            exit 1
          fi
          if sudo sh scripts/install_nazoauthctl.sh \
            --version v0.2.0 --install-path "$work/controller"; then
            echo "installer accepted a symlink target" >&2
            exit 1
          fi
      - name: Test controller
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Lint controller
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build controller
        run: cargo build --locked -p nazoauthctl --bin nazoauthctl --all-features --release
      - name: Smoke controller
        shell: bash
        run: target/release/nazoauthctl${{ runner.os == 'Windows' && '.exe' || '' }} --help
      - name: Verify published persistence remains readable
        if: runner.os != 'Windows'
        run: python3 scripts/verify_persistence_upgrade.py target/release/nazoauthctl
      - name: Stage the tested controller
        shell: bash
        run: |
          mkdir -p release
          cp "target/release/nazoauthctl${{ matrix.extension }}" \
            "release/nazoauthctl-${{ matrix.target }}${{ matrix.extension }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-${{ matrix.target }}
          path: release/nazoauthctl-${{ matrix.target }}${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true
