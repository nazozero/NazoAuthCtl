name: controller-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controller:
    name: controller-only / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Test controller
        run: cargo test --all-targets --all-features
      - name: Lint controller
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build controller
        run: cargo build --release --bin nazoauthctl
      - name: Smoke controller
        shell: bash
        run: target/release/nazoauthctl${{ runner.os == 'Windows' && '.exe' || '' }} --help
