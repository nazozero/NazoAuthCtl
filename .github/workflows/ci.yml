name: controller-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controller:
    name: controller-only / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Materialize dependency lock
        run: cargo generate-lockfile
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Test controller
        run: cargo test --locked --all-targets --all-features
      - name: Lint controller
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build controller
        run: cargo build --locked --release --bin nazoauthctl
      - name: Smoke controller
        shell: bash
        run: target/release/nazoauthctl${{ runner.os == 'Windows' && '.exe' || '' }} --help
      - name: Preserve resolved dependency lock
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
