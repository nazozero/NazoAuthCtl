name: controller-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# P1-9: every CI-built controller embeds its exact head so the C08 handshake
# compares real build identities instead of two empty dev strings.
env:
  NAZOAUTHCTL_BUILD_COMMIT: ${{ github.sha }}

jobs:
  controller:
    name: workspace / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Verify Linux installer syntax
        if: runner.os == 'Linux'
        run: sh -n scripts/install_nazoauthctl.sh
      - name: Reject ambiguous controller installation inputs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          touch "$work/existing"
          ln -s "$work/existing" "$work/controller"
          if sudo sh scripts/install_nazoauthctl.sh \
            --version v0.2.0.invalid --install-path "$work/plain"; then
            echo "installer accepted a non-release version" >&2
            exit 1
          fi
          if sudo sh scripts/install_nazoauthctl.sh \
            --version v0.2.0 --install-path "$work/controller"; then
            echo "installer accepted a symlink target" >&2
            exit 1
          fi
      - name: Test controller
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Lint controller
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build controller
        run: cargo build --locked --workspace --all-targets --all-features --release
      - name: Smoke controller
        shell: bash
        run: target/release/nazoauthctl${{ runner.os == 'Windows' && '.exe' || '' }} --help
