name: controller-dependency-lock-refresh

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - rust-toolchain.toml
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: read

jobs:
  resolve:
    if: github.event.pull_request.number == 82
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Resolve updated dependency graph and formatting on Linux
        run: |
          cargo update
          cargo metadata --locked --format-version 1 > controller-cargo-metadata.json
          cargo fmt --all
          git diff --binary > controller-dependency-resolution.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-dependency-resolution-${{ github.event.pull_request.head.sha }}
          path: |
            Cargo.lock
            controller-cargo-metadata.json
            controller-dependency-resolution.patch
          if-no-files-found: error
