[package]
name = "nazoauthctl"
version = "0.1.28"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nazozero/NazoAuthCtl"
rust-version = "1.97"

[[bin]]
name = "nazoauthctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
chrono = "0.4.45"
ed25519-dalek = "3.0.0"
fs2 = "0.4.3"
hmac = "0.13.0"
libc = "0.2.189"
nazo-operator-protocol = { version = "=0.1.24", git = "https://github.com/nazozero/NazoAuth", rev = "d759b069de50a5ee00c28a0adede88e6b448d08c" }
rand = "0.10.1"
rpassword = "7.4.0"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tar = "0.4.44"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.23.5", features = ["v7"] }
wait-timeout = "0.2.1"
x509-parser = "0.18.1"
zeroize = { version = "1.8.2", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
