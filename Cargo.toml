[workspace]
members = [
    "crates/nazoauthctl",
    "crates/nazoauthctl-conformance",
    "crates/nazoauthctl-runtime",
]
default-members = ["crates/nazoauthctl"]
resolver = "3"

[workspace.package]
version = "0.3.8"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nazozero/NazoAuthCtl"
rust-version = "1.99"

[workspace.dependencies]
hex = "0.4.3"
nazo-crypto = { git = "https://github.com/nazozero/NazoAuth.git", rev = "2f9146f329f9fbd21f988598ab6208f4c4e641f3", version = "0.3.6", default-features = false, features = ["ed25519"] }
nazo-operator-protocol = { git = "https://github.com/nazozero/NazoAuth.git", rev = "2f9146f329f9fbd21f988598ab6208f4c4e641f3", version = "0.3.6", package = "nazo-operator-protocol" }

[package]
name = "nazoauthctl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
pre-release-validation = []

[dependencies]
hex.workspace = true
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
cliclack = "=0.5.6"
fs2 = "0.4.3"
http = "1.5.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "native-tokio", "tls12", "rustls-platform-verifier"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
# Already compiled transitively (hyper-util depends on it); declared only so
# the controller-identity admin client can name request/response body types.
http-body-util = "0.1.5"
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "hyper-rustls"] }
nazo-crypto.workspace = true
nazo-operator-protocol.workspace = true
nazoauthctl-runtime = { path = "crates/nazoauthctl-runtime" }
rand = "0.10.3"
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = "1.15.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt", "time"] }
url = "2.5.8"
urlencoding = "2.1.3"
unicode-width = "0.2.2"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
x509-parser = "0.18.1"
yaml_serde = "0.10.7"
zeroize = { version = "1.9.1", features = ["derive", "serde"] }

[dev-dependencies]
http-body = "1.1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[patch.crates-io]
# Borrow immutable HTTP frames and move decoded owned strings without a body copy.
serde_json = { git = "https://github.com/bymoye/json", rev = "797bb92cabc5c67621d5d5fc3e60ed9284a02c63" }
